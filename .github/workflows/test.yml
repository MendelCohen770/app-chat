name: Test

on:
  pull_request:
    branches:
      - "**"

jobs:
  tests:
    name: Run available tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - client
          - server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.project }}
        run: npm ci

      - name: Detect usable test script
        id: detect-tests
        run: |
          node -e "const fs=require('fs'); const pkg=require('./${{ matrix.project }}/package.json'); const testScript=pkg.scripts&&pkg.scripts.test; const hasUsableTest=Boolean(testScript)&&!testScript.includes('no test specified'); fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${hasUsableTest}\n`);"

      - name: Run tests
        if: steps.detect-tests.outputs.run == 'true'
        working-directory: ${{ matrix.project }}
        run: npm test

      - name: Skip notice
        if: steps.detect-tests.outputs.run != 'true'
        run: echo "No usable test script found in ${{ matrix.project }}; skipping."

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        env:
          DB_CONNECTION: mongodb://127.0.0.1:27017/app-chat-e2e
          JWT_SECRET: test_secret_for_ci_123456
          CLIENT_ORIGIN: http://127.0.0.1:5173
          GOOGLE_CLIENT_ID: ci-google-client-id
          PORT: 3000
          VITE_API_BASE_URL: http://127.0.0.1:3000
        run: |
          npm --prefix server run dev > server.log 2>&1 &
          npm --prefix client run dev -- --host 127.0.0.1 --port 5173 > client.log 2>&1 &

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/health >/dev/null

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173 >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5173 >/dev/null

          npm --prefix client run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: client/playwright-report
          if-no-files-found: ignore

      - name: Dump app logs on failure
        if: failure()
        run: |
          echo "----- server.log -----"
          cat server.log || true
          echo "----- client.log -----"
          cat client.log || true
